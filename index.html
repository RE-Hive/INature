<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di INature</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .landing-page {
            height: 100vh;
            background: linear-gradient(rgba(26, 77, 46, 0.7), rgba(26, 77, 46, 0.8)), url('img/landing_bg_1778798914855.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--bg);
            padding: 20px;
        }
        .landing-content {
            max-width: 800px;
            animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .landing-title {
            font-size: clamp(3.5rem, 10vw, 6rem);
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .landing-subtitle {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            margin-bottom: 3rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        .btn-landing {
            background-color: var(--bg);
            color: var(--primary);
            font-size: 1.2rem;
            padding: 16px 48px;
            border-radius: 50rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            display: inline-block;
        }
        .btn-landing:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 48px rgba(0,0,0,0.4);
            color: var(--primary-hover);
            background-color: var(--accent-light);
        }
    </style>
</head>
<body>
    <div class="landing-page">
        <div class="landing-content">
            <div class="mb-4" style="animation: fadeIn 1s ease-out 0.5s both;">
                <i class="bi bi-tree-fill" style="font-size: 5rem; color: var(--accent-light); text-shadow: 0 4px 20px rgba(0,0,0,0.3);"></i>
            </div>
            <h1 class="landing-title text-white">INature</h1>
            <p class="landing-subtitle">Langkah kecilmu hari ini, untuk Bumi yang lebih lestari esok hari. Temukan panduan komprehensif hidup hijau, hitung presisi jejak karbon harianmu, dan bergabunglah dalam misi menyelamatkan lingkungan kita.</p>
            <a href="beranda.html" class="btn-landing">
                Jelajahi Sekarang <i class="bi bi-arrow-right ms-2"></i>
            </a>
        </div>
    </div>
</body>
</html>
